[package]
name = "zipscope-heap"
description = "The wasm allocator of Zipscope: a count of the live heap, a memory cap and the shared memory budget"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
version.workspace = true

# The allocator of the wasm build: dlmalloc, as in std, with a system part
# that asks the shared memory budget before it grows the wasm memory.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2.14", default-features = false }

[lints]
workspace = true
