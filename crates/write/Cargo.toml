[package]
name = "zipscope-write"
description = "The write module of Zipscope: the zstd remux of an archive with rawzip's writer"
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rawzip.workspace = true
wasm-bindgen.workspace = true
zipscope-heap = { path = "../heap" }
zipscope-layout = { path = "../layout" }
# The decoders and the verifying stream of the read module, without its
# wasm exports and its allocator.
zipscope-read = { path = "../read", default-features = false }
# The C zstd library (zstd 1.5.7) for the encoder. No pure-Rust zstd.
zstd-safe = { version = "8.0.0", default-features = false }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
zipscope-core = { path = "../core" }
zipscope-testkit = { path = "../testkit" }
zstd = { version = "0.14.0", default-features = false }

[lints]
workspace = true
