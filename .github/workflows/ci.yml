name: ci
on:
  pull_request:
  push:
    branches:
      - main
  # Runs the checks on a branch without a pull request.
  workflow_dispatch:

# Principle of least privilege.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: jdx/mise-action@v5
      - run: mise run format:check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: jdx/mise-action@v5
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: jdx/mise-action@v5
      - run: mise run test
        env:
          # The differential test compares with zipinfo (from unzip).
          ZIPSCOPE_REQUIRE_ZIPINFO: 1

  # Builds the wasm and the web app, serves the build with the real
  # `_headers` (Cloudflare Vite plugin), and runs the Playwright tests on
  # Chromium. Before that, it runs the vitest browser tests on Chromium. A
  # broken isolation setup fails here.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: jdx/mise-action@v5
      - run: mise run e2e:install
      - run: mise run test:browser
      - run: mise run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  # Deploys main to production after all checks pass.
  deploy-production:
    needs: [format-check, lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://zip.nickb.dev
    # One production deploy at a time. A deploy always runs to its end.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: jdx/mise-action@v5
      - working-directory: web
        run: |
          mise run build:production
          pnpm exec wrangler deploy --message "$GITHUB_SHA"
